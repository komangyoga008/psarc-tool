
name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Check Windows SDK
      shell: powershell
      run: |
        Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include"

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:WindowsTargetPlatformVersion=10.0 ${{ env.SOLUTION_FILE_PATH }}

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: psarc-tool
        path: bin
        retention-days: 64
